server {

  listen 8080;
  sendfile on;
  default_type application/octet-stream;
  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6].";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_comp_level   5;
  root /usr/share/nginx/html;

  # Página inicial pré-renderizada.
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Demais páginas: cada rota tem www/<rota>/index.html gerado pelo
  # scripts/prerender.mjs. Rota sem pasta correspondente = 404.
  location ~ "^/([a-z0-9-]+)/?$" {
    try_files /$1/index.html =404;
    add_header Cache-Control "no-cache";
  }

  # JS/CSS do build têm hash no nome: podem ficar em cache por 1 ano.
  location ~* "\.[0-9a-f]{16,}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Imagens, vídeos e fontes: 30 dias.
  location ~* \.(?:webp|jpg|jpeg|png|svg|ico|mp4|woff2?|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Arquivos estáticos; o que não existir cai no 404 abaixo.
  location / {
    try_files $uri =404;
  }

  location = /health {
      access_log off;
      return 200 'OK';
      add_header Content-Type text/plain;
  }

  # Endereço inexistente: status 404 (para o Google), mas com o app
  # carregado, que redireciona o visitante para a página inicial.
  error_page 404 /index.html;
  
}
