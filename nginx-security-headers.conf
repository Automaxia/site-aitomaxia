# Cabeçalhos de segurança — incluído no server e em CADA location que tem add_header
# (no nginx, um add_header dentro de um location anula os herdados do server).
#
# CSP: 'unsafe-inline' em script-src por causa dos handlers inline dos vídeos (oncanplay) e em
# style-src por causa dos estilos que o Ionic injeta. Origens externas: Google Analytics/Tag Manager,
# Google Fonts, jsDelivr (biblioteca do EmailJS) e a API do EmailJS (envio do formulário).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; media-src 'self'; connect-src 'self' https://api.emailjs.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
